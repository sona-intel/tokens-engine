    get:
      operationId: getChainTvl
      tags: [Markets]
      summary: Get the total value locked of a chain, by day
      description: |
        Call this for a chain's DeFi TVL history. `current_usd` is the last point, DefiLlama's TVL of the chain now. `change_1d_pct` and `change_7d_pct` compare it with the point 1 and 7 days before it, and are null when that day is missing. `days` is 30, 90, 365 or all, default 90. The last item is the current UTC day, still in progress. Only `eip155:1` and `eip155:143` are served. The figures come from DefiLlama, are read every hour and held in memory.
      parameters:
