        Call this for six daily series of a chain: transactions, active accounts, new accounts, the average gas price in gwei, the transaction fees in ETH and the block utilization in percent. `days` is 30, 90 or 365, default 90. Only Ethereum (`eip155:1`) has them, from Blockscout's stats service; Monad answers 404 `unsupported_chain` because no source is wired for it. The last item is the current UTC day. Read every hour.
