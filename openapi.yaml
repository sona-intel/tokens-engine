          description: The record.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChainTvl'}
              examples:
                real:
                  summary: A real answer
                  value: {"kind": "chain_tvl", "chain": "eip155:143", "current_usd": 1031104035, "change_1d_pct": 3.5, "change_7d_pct": -0.67, "items": [{"day": "2026-10-11", "tvl_usd": 1001011190}, {"day": "2026-10-12", "tvl_usd": 996281615}, {"day": "2026-10-13", "tvl_usd": 1031104035}], "coverage": ["chain_series_last_day_partial"]}
