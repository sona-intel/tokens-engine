chains:
  - id: "eip155:1"
    name: ethereum
    rpc_url: http://rpc-router:4000/sona/ethereum
    hypersync_url: https://eth.hypersync.xyz/query
    holders: blockscout
    gecko_network: eth
    wrapped_native: "0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2"
  - id: "eip155:143"
    name: monad
    rpc_url: http://rpc-router:4000/sona/monad
    hypersync_url: https://monad.hypersync.xyz/query
    holders: index
    gecko_network: monad
    # WMON, a WETH9 copy whose Deposit and Withdrawal events mint and burn
    wrapped_native: "0x3bd359c1119da7da1d913d1c4d2b7c461115433a"
# X-ERPC-Use-Upstream on every JSON-RPC request, so the router never uses its paid dRPC upstreams
rpc_upstream_filter: "!drpc-*"
blockscout_url: https://eth.blockscout.com
blockscout_per_second: 3
geckoterminal_url: https://api.geckoterminal.com/api/v2
geckoterminal_network: monad
# GeckoTerminal allows about 30 a minute for everyone on this address, so the engine keeps to 20
geckoterminal_per_minute: 20
prices_url: http://prices:8080
# the HyperSync key allows 15 requests a minute for everyone and x402-indexer uses most of them:
# the index (backfill and tail) keeps to 3, visitors' Ethereum transfer windows to 2.
# Holder-map jobs take their requests from the same 2, behind every visitor: at most 1 a minute, and only while a slot stays free
hypersync_per_minute: 3
hypersync_interactive_per_minute: 2
meta_cache: 2m
holders_cache: 10m
geckoterminal_cache: 15m
transfers_cache: 15m
price_cache: 1m
# a token search is kept 5 minutes, GeckoTerminal allows few requests and a search spends one per chain
search_cache: 5m
# Curated token lists in the Uniswap token list format. The tokens on them are verified in a search, and the earlier
# a list the higher it ranks. They load on start and again every token_list_refresh; a list that fails keeps its last copy.
token_lists:
  # Uniswap Labs' default list, the engine keeps its Ethereum (1) and Monad (143) entries
  - name: uniswap-default
    url: https://tokens.uniswap.org
  # the Monad Foundation's list of Monad mainnet tokens, https://github.com/monad-crypto/token-list
  - name: monad-mainnet
    url: https://raw.githubusercontent.com/monad-crypto/token-list/refs/heads/main/tokenlist-mainnet.json
token_list_refresh: 24h
token_list_timeout: 20s
# Ethereum's large transfers come from the last blocks: 7,200 blocks is about a day, cut down for busy tokens
transfer_window_blocks: 7200
transfer_min_blocks: 20
transfer_page_budget: 3
index:
  max_tokens: 50
  # a backfill that would need more HyperSync requests than this follows the token's recent activity instead
  backfill_budget: 120
  # about 2 hours of Monad blocks
  activity_window_blocks: 20000
  tail_interval: 60s
  lag_blocks: 10
  window_days: 7
  top_per_day: 100
  retry_failed_after: 10m
  prewarm:
    - "0x754704bc059f8c67012fed69bc8a327a5aafb603" # USDC
    - "0x3bd359c1119da7da1d913d1c4d2b7c461115433a" # WMON
# Chain and market routes: top coins from CoinGecko, DeFi figures from DefiLlama, activity from Blockscout's stats service.
# Everything is read in the background and held in memory; the optional COINGECKO_API_KEY (a demo key) goes in the x-cg-demo-api-key header.
markets:
  coingecko_url: https://api.coingecko.com/api/v3
  # CoinGecko's keyless tier is shared and strict, so the engine sends at most one request every 20 seconds
  coingecko_min_gap: 20s
  top_coins_refresh: 5m
  # the coin list with contract addresses is 4 MB
  platforms_refresh: 24h
  llama_url: https://api.llama.fi
  stablecoins_url: https://stablecoins.llama.fi
  llama_per_minute: 30
  defi_refresh: 1h
  activity_refresh: 1h
  chains:
    - id: "eip155:1"
      llama_name: Ethereum
      activity: true
    - id: "eip155:143"
      llama_name: Monad
# Holder map: bubbles for the largest holders, and on Ethereum links between holders that sent each other the token.
# Links come from HyperSync in a background job on the visitors' share of the quota (hypersync_interactive_per_minute),
# at a lower priority than visitors and at most 1 request a minute, so a map of 8 requests takes about 8 minutes.
holder_map:
  window_days: 30
  # at most this many HyperSync requests per map, a busy token gets a shorter window
  page_budget: 8
  fresh_for: 12h
  keep_for: 168h
  queue_max: 20
  retry_failed_after: 10m
